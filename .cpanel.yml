# .cpanel.yml - cPanel deployment configuration
# Place this file at the repository root. Uses CPANEL_USER environment variable to determine cPanel username; if not set, defaults to USERNAME.

deployment:
  tasks:
    - name: Start deployment
      commands:
        - echo "Starting cPanel deployment"

    - name: Install dependencies if package.json exists
      commands:
        - if [ -f package.json ]; then echo "package.json found, installing dependencies"; npm ci; else echo "no package.json, skipping npm install"; fi

    - name: Build project if a build script exists in package.json
      commands:
        - if [ -f package.json ] && grep -q "\"build\"" package.json; then echo "build script found, running npm run build"; npm run build; else echo "no build script, skipping build"; fi

    - name: Choose source folder
      commands:
        - SRC="."
        - if [ -d dist ]; then SRC="dist"; fi
        - if [ -d build ]; then SRC="build"; fi
        - echo "Deploying from $SRC"

    - name: Deploy to public_html
      commands:
        - if [ -z "\"$CPANEL_USER\"" ] || [ "$CPANEL_USER" = "" ]; then echo "CPANEL_USER not set; using fallback 'USERNAME'. To avoid this, set the CPANEL_USER environment variable in cPanel repository settings."; fi
        - echo "Copying files to /home/${CPANEL_USER:-USERNAME}/public_html/"
        - rsync -av --delete "$SRC"/ "/home/${CPANEL_USER:-USERNAME}/public_html/"

    - name: Finish
      commands:
        - echo "Deployment finished"
